# Run the Supernova server:  docker compose up -d
# Your original APK must be in ./apk (the server reads the client key from it).
services:
  supernova:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./apk:/apk:ro
      - supernova-data:/data
    environment:
      SUPERNOVA_WORLD_NAME: Supernova
      SUPERNOVA_SPEED: "1"   # game speed: production and build times
      SUPERNOVA_BACKUP_HOURS: "6"   # database backups in /data/backups
      SUPERNOVA_GC_EVERY_DAYS: "0"   # e.g. 14: a Galaxy Challenge every two weeks
      SUPERNOVA_ARENA_EVERY_DAYS: "0"   # e.g. 10: an arena every ten days
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 1m
      timeout: 10s
    restart: unless-stopped

volumes:
  supernova-data:
