# Run the Supernova server:  docker compose up -d
# Your original APK must be in ./apk (the server reads the client key from it).
services:
  supernova:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./apk:/apk:ro
      - supernova-data:/data
    environment:
      SUPERNOVA_WORLD_NAME: Supernova
      SUPERNOVA_SPEED: "1"   # game speed: production and build times
    restart: unless-stopped

volumes:
  supernova-data:
