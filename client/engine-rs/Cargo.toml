[package]
name = "supernova-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Supernova's client engine: Galaxy Empire's own scripts and screens on 64-bit devices"
publish = false

[workspace]
members = ["android"]
exclude = ["ruffle"]

[dependencies]
ruffle_core = { path = "ruffle/core", features = ["default_font"] }
ruffle_render_wgpu = { path = "ruffle/render/wgpu" }
futures = "0.3.32"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
mlua = { version = "0.12.2", features = ["lua51", "vendored", "serialize", "error-send"] }
serde_json = "1.0.154"
zip = { version = "2", default-features = false, features = ["deflate"] }
# plain HTTP only: the scripts' https addresses are rewritten to the Supernova server
ureq = { version = "2", default-features = false, features = ["cookies"] }
winit = "0.30.13"
swf = { path = "ruffle/swf" }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
md-5 = "0.10"
flate2 = "1.1.10"
crc32fast = "1.5.3"
sha2 = "0.10"
ttf-parser = "0.25.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
